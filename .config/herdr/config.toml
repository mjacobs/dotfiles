onboarding = false

[ui]
show_agent_labels_on_pane_borders = true

# Keep Herdr's mouse UI enabled. Ghostty reserves Shift+mouse as its native
# bypass (`mouse-shift-capture = never`), so use Shift+middle-click to paste
# the primary selection without giving up Herdr clicks, drags, or menus.
mouse_capture = true

# Agents panel as an attention queue: blocked/waiting agents bubble to the top
# (replaces the removed agent_panel_scope; "spaces" = grouped-by-space default).
agent_panel_sort = "priority"

# Claude rows show the live terminal title (Claude Code updates it with its
# current activity), so the sidebar shows what each Claude is working on.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.toast]
delivery = "herdr"

[ui.sound]
enabled = false

[theme]
name = "one-dark"

auto_switch = false
[experimental]
pane_history = true

[keys]
# Direct (prefix-less) chords for quick navigation.
# NOTE: herdr (0.6.10) cannot bind PageUp/PageDown/Home/End, so ctrl+pgup/pgdn
# is impossible; arrow chords are the workable substitute.
#
# REQUIRES Ghostty to release these chords (it binds them by default):
#   keybind = ctrl+shift+arrow_left=unbind   (etc.)
# Otherwise Ghostty intercepts them and herdr never sees the key.

# left/right: focus the pane (split) in that direction within the workspace.
# Arrays keep the default prefix+h/l bindings AND add the direct chords.
focus_pane_left  = ["prefix+h", "ctrl+shift+left"]
focus_pane_right = ["prefix+l", "ctrl+shift+right"]

# up/down: move between workspaces.
previous_workspace = "ctrl+shift+up"
next_workspace     = "ctrl+shift+down"

# Jump straight to the Nth agent row. With agent_panel_sort = "priority",
# prefix+alt+1 is always the agent most in need of attention.
focus_agent = "prefix+alt+1..9"

# Focus the next agent terminal that is waiting for input (status "blocked").
# Press repeatedly to cycle through every waiting agent; toasts if none wait.
# Uses a prefix chord so it never steals a keystroke from the focused agent.
# Want a single-press chord instead? Swap to e.g. key = "ctrl+shift+a" and add
#   keybind = ctrl+shift+a=unbind
# to your Ghostty config so the terminal releases it (same as the arrows above).
[[keys.command]]
key = "prefix+a"
type = "shell"
command = "herdr-focus-next-waiting"

# AI quota popup: colored showy-quota strip + codexbar per-provider detail.
# Any key inside the popup closes it; content refreshes every 30s.
[[keys.command]]
key = "prefix+u"
type = "popup"
command = "showy-quota-popup"
width = 92
height = 24

# Lazygit over the current tab without disturbing the layout.
# Press ctrl+b, release, then ctrl+g (prefix chords are sequential, not held);
# or just hyper+g (keyd macros it). NOT alt+g: KDE grabs Alt+G globally for the
# Application Launcher widget, and even keyd-emitted events pass through KDE.
[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
width = "80%"
height = "80%"

[update]
channel = "preview"
