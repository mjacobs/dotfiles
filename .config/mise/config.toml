# Versions are pinned exactly on purpose: a "latest" specifier forces mise to
# resolve it over the network on every new shell via hook-env. Exact versions
# resolve from the local cache and keep shell startup predictable.
[tools]
carapace = "1.7.3"
crush = "0.88.0"
gcloud = "579.0.0"
gemini-cli = "0.54.0"
go = "1.26.5"
herdr = "0.8.0"
infisical = { version = "0.43.120", asset_pattern = "cli_{{ version }}_{{ os(macos='darwin') }}_{{ arch(x64='amd64') }}.tar.gz" }
lazygit = "0.64.0"
markdownlint-cli2 = "0.23.2"
node = "26.7.0"
pnpm = "11.20.0"
poetry = "2.4.1"
prettier = "3.9.6"
usage = "5.0.0"
uv = "0.12.2"
yazi = "26.5.6"
zig = "0.16.0"
lazydocker = "0.25.2"
python = "3.14.7"
"github:sigoden/dufs" = "0.46.0"
prek = "0.4.12"
powershell = "7.6.4"
bun = "1.3.14"

[settings]
minimum_release_age = "4h"

[settings.go]
set_gobin = false
